# Publishes a version-tagged image on v* tags, alongside the :latest image that
# publish.yml pushes on every main commit. ECS task definitions must reference a
# semver tag: the Comms and Automations accounts pull this image through an ECR
# pull-through cache, and cache repositories cannot have immutable tags, so
# :latest fails the Vanta aws-ecs-fargate-version-controlled-images test.
#
# Kept separate from publish.yml so that workflow's paths-ignore filter, which is
# meant for main commits, cannot skip a release build.
name: Build and publish tagged docker image
on:
  push:
    tags: ["v*"]
concurrency: publish
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::011833101604:role/secretexec-public-ecr-repo
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - uses: docker/build-push-action@v6
        id: push
        with:
          push: true
          platforms: |
            linux/arm64
            linux/amd64
          tags: |
            ghcr.io/doist/secretexec:${{ github.ref_name }}
            public.ecr.aws/n9b3m5a6/doist/secretexec:${{ github.ref_name }}
          outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=6,force-compression=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/doist/secretexec
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

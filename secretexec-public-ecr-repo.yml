Description: Manages secretexec public ECR repository
Resources:
  Repository:
    Type: AWS::ECR::PublicRepository
    Properties:
      RepositoryName: doist/secretexec
  GithubRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref AWS::StackName
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringLike:
                # Tag pushes publish the version-tagged image (see
                # .github/workflows/publish-tag.yml), so they need to assume this
                # role too.
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:Doist/secretexec:ref:refs/heads/main'
                  - !Sub 'repo:Doist/secretexec:ref:refs/tags/v*'
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicPowerUser']

name: Build and publish docker image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md", ".github/**"]
concurrency: publish
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::011833101604:role/secretexec-public-ecr-repo
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - uses: docker/build-push-action@v6
        id: push
        with:
          push: true
          platforms: |
            linux/arm64
            linux/amd64
          tags: |
            ghcr.io/doist/secretexec:latest
            public.ecr.aws/n9b3m5a6/doist/secretexec:latest
          outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=6,force-compression=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/doist/secretexec
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
